version: "3.9"
services:
  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword
      - MARIADB_DATABASE=sales_database
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./sql/mariadb.cnf:/etc/mysql/conf.d/mariadb.cnf:ro
    healthcheck:
      test: ["CMD", "mariadb", "-uroot", "-prootpassword", "-e", "SELECT 1;"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "bash", "-c", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 20

  jobmanager:
    build:
      context: ./docker/flink
      dockerfile: Dockerfile
    container_name: jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |-
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
    volumes:
      - ./jobs/flink:/opt/jobs/flink:ro
    depends_on:
      kafka:
        condition: service_healthy
      mariadb:
        condition: service_healthy

  taskmanager:
    build:
      context: ./docker/flink
      dockerfile: Dockerfile
    container_name: taskmanager
    command: taskmanager
    depends_on:
      - jobmanager

  spark-master:
    image: bitnami/spark:3.5
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./jobs/spark:/opt/jobs/spark:ro
      - ./metrics:/data
    depends_on:
      kafka:
        condition: service_healthy

  spark-worker:
    image: bitnami/spark:3.5
    container_name: spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master

  generator:
    build:
      context: ./docker/generator
      dockerfile: Dockerfile
    container_name: load-generator
    environment:
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=sales_database
      - RATE_PER_SEC=50
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
  kafka_data:
